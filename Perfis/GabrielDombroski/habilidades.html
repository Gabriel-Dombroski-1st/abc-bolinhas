<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Habilidades</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
        <style>
                :root {
                    --bg: #090611;
                    --panel: #120b20;
                    --linha: #2a1a40;
                    --cor-auxiliar-1: #6d28d9;
                    --cor-auxiliar-2: #8b5cf6;
                    --texto: #f3edff;
                }

                * {
                    box-sizing: border-box;
                    margin: 0;
                }

                body {
                    background: transparent;
                    font-family: Inter, system-ui, sans-serif;
                    color: var(--texto);
                }

                /* Grade de habilidades */

                .grupo {
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
                    gap: 12px;
                    padding: 10px;
                }

                /* Cartões */

                .habilidade {
                    border: 1px solid var(--linha);
                    background: var(--panel);
                    border-radius: 8px;
                    padding: 18px 6px;
                    text-align: center;
                    font-size: 12px;
                }

                .habilidade:hover {
                    cursor: pointer;
                    box-shadow: 0px 0px 10px var(--cor-auxiliar-2);
                }

                /* Ícones e destaques */

                .habilidade b {
                    display: block;
                    font-size: 20px;
                    color: var(--cor-auxiliar-1);
                    margin-bottom: 10px;
                    height: 26px;
                }
        </style>
    </head>
    <body>
        <div class="grupo">
            <div class="habilidade"><b>⊞</b>Office</div>
            <div class="habilidade"><b>🎨</b>Criatividade</div>
            <div class="habilidade"><b>🧩</b>Lógica</div>
            <div class="habilidade"><b>🛢</b>MySQL</div>
            <div class="habilidade"><b>C#</b>Programação</div>
            <div class="habilidade"><b>⚙</b>Hardware</div>
        </div>
    </body>
</html>
